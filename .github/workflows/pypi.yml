
name: Publish package

on:
    workflow_dispatch:
      inputs:
        tag: 
          description: Tag to build release from
          required: true
    release:
        types: [released]

permissions:
  contents: read

jobs:
    pypi_publish:
        runs-on: ubuntu-latest
        environment: pypi
        permissions:
          id-token: write
          contents: write 
        steps:

        - name: Checkout (from release)
          if: startsWith(github.ref, 'refs/tags/')
          uses: actions/checkout@v4
          with:
            ref: ${{ github.ref_name }}
        
        - name: Checkout (from inputs)
          if: ${{ !startsWith(github.ref, 'refs/tags/') }}
          uses: actions/checkout@v4
          with:
            ref: ${{ github.event.inputs.tag }}

        - name: Setup Python
          uses: actions/setup-python@v3
          with:
            python-version: '3.10'
        
        - name: Install packages
          run: |
            python -m pip install build twine
        
        - name: Build
          run: |
            python -m build
                
        - name: Attach binaries
          if: startsWith(github.ref, 'refs/tags/')
          uses: softprops/action-gh-release@v2
          with:
            token: ${{ secrets.GITHUB_TOKEN }}
            files: |
              dist/*
        
        - name: Upload to PyPi
          uses: pypa/gh-action-pypi-publish@release/v1
